# Static host for the Angular build in the split deployment. The API, MCP endpoint and
# /healthz belong to the .NET Functions host, so this server has no /api or /mcp proxy.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  include /etc/nginx/snippets/comply-headers.conf;

  # SPA routes such as /workspace/boards are resolved by Angular. index.html stays
  # revalidated so a new deployment is picked up immediately.
  location / {
    include /etc/nginx/snippets/comply-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }

  # Runtime API configuration must be editable after deploy without a stale CDN copy.
  location = /config.js {
    include /etc/nginx/snippets/comply-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri =404;
  }

  # Content-hashed bundles and assets never change for a given file name.
  location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
    include /etc/nginx/snippets/comply-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }
}
